[tool.poetry]
name = "cpa-tools"
version = "0.8.8"
description = "Compositional Perturbation Autoencoder (CPA)"
authors = ["Mohsen Naghipourfar <naghipourfar@berkeley.edu>"]
license = "MIT"
readme = "README.md"
packages = [
    {include = "cpa"},
]

[tool.poetry.dependencies]
python = ">=3.10, <3.13"
llvmlite = ">=0.43"
anndata = ">=0.10.0, <0.13.0"
scipy = ">=1.12.0"
scvi-tools = ">=1.3.0,<1.5.0"
importlib-metadata = "*"
scanpy = "*"
rdkit = "*"
torch = { version = ">=2.7.0,<2.12.0" }
adjustText = "*"
numpy = '>=1.26,<2.4'
seaborn = "*"
gdown = "*"
jax = ">=0.4.28"
jaxlib = ">=0.4.28"
torchaudio = ">=2.7.0,<2.12.0"
lightning = ">=2.4.0,<2.6.0"
pytorch-lightning = ">=2.4.0,<2.6.0"
ray = { version = ">=2.20.0,<2.50.0", extras = ["data", "train", "tune", "serve"] }
setuptools = ">=70.0.0"

# Optional dependencies
pytest = "*"
pytest-cov = "*"
black = "*"
flake8 = "*"
jupyter = "*"
nbformat = "*"
nbconvert = "*"
sphinx = "*"
scanpydoc = "*"
nbsphinx = "*"
nbsphinx-link = "*"
ipython = "*"
toml = "*"
pydata-sphinx-theme = "*"
typing_extensions = "*"
sphinx-autodoc-typehints = "*"
sphinx_gallery = "*"
sphinx-rtd-theme = "*"


[tool.poetry.extras]
docs = ["sphinx", "scanpydoc", "nbsphinx", "nbsphinx-link", "ipython", "toml", "pydata-sphinx-theme", "typing_extensions", "sphinx-autodoc-typehints", "sphinx_gallery", "sphinx-rtd-theme"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
